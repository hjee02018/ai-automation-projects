<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRM 3D Digital Twin</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111827; }
        canvas { display: block; }
        #info {
            position: absolute; top: 10px; left: 10px;
            color: #3B82F6; font-family: sans-serif; font-size: 12px;
            pointer-events: none; text-transform: uppercase; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="info">SRM Real-time Physics Engine Ready</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111827);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 3. Grid Helper (Floor)
        const gridHelper = new THREE.GridHelper(200, 50, 0x374151, 0x1F2937);
        scene.add(gridHelper);

        // 4. Stacker Crane Model Group
        const srmGroup = new THREE.Group();
        scene.add(srmGroup);

        // Mast (Base)
        const mastGeometry = new THREE.BoxGeometry(1, 15, 1);
        const mastMaterial = new THREE.MeshStandardMaterial({ color: 0x3B82F6 });
        const mast = new THREE.Mesh(mastGeometry, mastMaterial);
        mast.position.y = 7.5;
        srmGroup.add(mast);

        // Carriage (Lift Part)
        const carriageGeometry = new THREE.BoxGeometry(1.5, 0.5, 2);
        const carriageMaterial = new THREE.MeshStandardMaterial({ color: 0x8B5CF6 });
        const carriage = new THREE.Mesh(carriageGeometry, carriageMaterial);
        carriage.position.y = 2; // Initial Lift Pos
        srmGroup.add(carriage);

        // Fork (Load Part)
        const forkGeometry = new THREE.BoxGeometry(1.2, 0.1, 1.8);
        const forkMaterial = new THREE.MeshStandardMaterial({ color: 0x10B981 });
        const fork = new THREE.Mesh(forkGeometry, forkMaterial);
        fork.position.y = 0.3;
        carriage.add(fork);

        camera.position.set(15, 10, 15);
        camera.lookAt(0, 5, 0);

        // 5. Animation Logic (Mock movement)
        let travelPos = 0;
        let liftPos = 2;
        let direction = 1;

        function animate() {
            requestAnimationFrame(animate);

            // Simulate Movement
            travelPos += 0.05 * direction;
            liftPos += 0.02 * direction;

            if (travelPos > 20 || travelPos < -20) direction *= -1;

            srmGroup.position.z = travelPos;
            carriage.position.y = 2 + (Math.sin(Date.now() * 0.001) + 1) * 5; // Bobbing lift
            
            // Interaction with mouse/auto-rotate
            scene.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
